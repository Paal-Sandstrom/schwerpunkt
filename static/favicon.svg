<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
    <!-- Dark green background -->
    <rect width="100" height="100" fill="#1f4d1f" rx="15" ry="15"/>
    
    <!-- Bright retro-terminal green styling -->
    <style>
        .stroke-neon { stroke: #4dff4d; fill: none; stroke-width: 5; stroke-linejoin: round; stroke-linecap: round; }
        .stroke-dashed-neon { stroke: #4dff4d; fill: none; stroke-width: 3; stroke-dasharray: 6,6; }
        .fill-neon { fill: #4dff4d; }
    </style>

    <!-- Triangle A(0,95) B(50,5) C(100,95) -->
    <polygon points="10,90 50,15 90,90" class="stroke-neon"/>

    <!-- Medians -->
    <line x1="10" y1="90" x2="70" y2="52.5" class="stroke-dashed-neon"/>
    <line x1="50" y1="15" x2="50" y2="90" class="stroke-dashed-neon"/>
    <line x1="90" y1="90" x2="30" y2="52.5" class="stroke-dashed-neon"/>

    <!-- Centroid Dot S -->
    <circle cx="50" cy="65" r="5" class="fill-neon"/>
</svg>
